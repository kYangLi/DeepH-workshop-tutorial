# Shared build configuration for every language.
#
# INHERIT picks the language layer (site_name + nav), docs_dir picks its sources.
# Two Read the Docs projects build this same file from the same commit:
#
#   English   DOCS_DIR unset     I18N_BASE unset          -> docs/en + .mkdocs/en.yml
#   简体中文   DOCS_DIR=docs/zh   I18N_BASE=.mkdocs/zh.yml -> docs/zh + .mkdocs/zh.yml

INHERIT: !ENV [I18N_BASE, ".mkdocs/en.yml"]
docs_dir: !ENV [DOCS_DIR, "docs/en"]

site_url: https://deeph-workshop-tutorial.readthedocs.io/
repo_url: https://github.com/kYangLi/DeepH-workshop-tutorial/
repo_name: kYangLi/DeepH-workshop-tutorial
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - toc.integrate
    - navigation.expand
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

copyright: "Copyright &copy; 2025 DeepH Team"

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true
