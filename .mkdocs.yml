site_name: DeepH Workshop Tutorial
site_url: https://deeph-workshop-tutorial.readthedocs.io/
repo_url: https://github.com/kYangLi/DeepH-workshop-tutorial/
repo_name: kYangLi/DeepH-workshop-tutorial
edit_uri: edit/main/docs/
site_description: "Comprehensive guide for DeepH-pack: from theory to practical applications with Universal Materials Models"

docs_dir: "docs"

theme:
  name: readthedocs

plugins:
  - search

nav:
  - Home: index.md
  - "Workshop 2025":
      - 2025/index.md
      - "Theoretical Backgrounds": 2025/1.Theoretical_backgrounds.md
      - "Installation Guide": 2025/2.Installation.md
      - "Data Interface Setup": 2025/3.Interface.md
      - "Model Training": 2025/4.Training.md
      - "Prediction & Inference": 2025/5.Inference.md
      - "Universal Materials Models": 2025/6.UMM_odyssey.md
  - "Workshop 2026":
      - 2026/index.md

copyright: "Copyright &copy; 2025 DeepH Team"

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true
