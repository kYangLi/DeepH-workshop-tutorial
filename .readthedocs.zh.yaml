# Build recipe for the Chinese edition. Point the Chinese Read the Docs project
# at this path in its settings ("Path for .readthedocs.yaml"), so both language
# projects can share one repository and one branch per year.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/zh/conf.py

python:
  install:
    - requirements: .requirements.txt
