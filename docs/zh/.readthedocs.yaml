# Chinese build recipe for the 2026 edition.
#
# Read the Docs only accepts the file name `.readthedocs.yaml`, so the Chinese
# project uses a copy in a sub-folder instead: set
#   Path for .readthedocs.yaml = docs/zh/.readthedocs.yaml
# in the Chinese project's settings. All paths in this file are relative to the
# repository root, not to this file.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/zh/conf.py

python:
  install:
    - requirements: .requirements.txt
