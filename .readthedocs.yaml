# Build recipe for the English edition (this file, at the repository root).
# The Chinese edition uses .readthedocs.zh.yaml, selected in the Read the Docs
# project settings under "Path for .readthedocs.yaml".
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/en/conf.py

python:
  install:
    - requirements: .requirements.txt
